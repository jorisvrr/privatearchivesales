<!--
  Template: render with  node scripts/render-emails.mjs  (fills {{name}} and {{eventCredit}} from src/config/brand.ts).
  {{name}} — round 2: everyone else on the drop's waitlist.
  Audience: the drop's waitlist entries tagged  drop:<drop-id>:round-2  (never round-1 entries: upgraded entries leave round 2).
  Subject: The [Label] archive is open
  Send after the first-access window. Replace every [bracketed] value with supplied information.
  The sender must be a real {{name}} address on a verified domain; none exists yet.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The [Label] archive is open</title>
  </head>
  <body style="margin:0;background:#ffffff;color:#000000;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:470px;">
            <tr><td style="font:600 14px/20px Arial,Helvetica,sans-serif;padding-bottom:56px;">{{name}}</td></tr>
            <tr><td style="font:500 16px/18px Arial,Helvetica,sans-serif;">[Label] — Archive Sale [001]</td></tr>
            <tr><td style="font:400 17px/20px Georgia,'Times New Roman',serif;padding-top:10px;">{{eventCredit}}</td></tr>
            <tr>
              <td style="font:400 16px/25.6px Georgia,'Times New Roman',serif;padding-top:40px;">
                The second round is open. The [Label] archive is now open to everyone on the waitlist, on [Label]’s website, until [closing date].
              </td>
            </tr>
            <tr>
              <td style="padding-top:32px;">
                <a href="[Archive page on the label’s website]" style="display:inline-block;background:#0a0a0a;color:#ffffff;font:500 13px/1 Arial,Helvetica,sans-serif;text-decoration:none;padding:12px 16px;border-radius:4px;">Open the archive</a>
              </td>
            </tr>
            <tr>
              <td style="font:400 12px/1.4 Georgia,'Times New Roman',serif;color:#6b6b6b;padding-top:56px;">
                You’re receiving this because you joined the [Label] archive waitlist. <a href="[Unsubscribe link]" style="color:#6b6b6b;">Unsubscribe</a>.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

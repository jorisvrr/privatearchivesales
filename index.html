<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%BRAND_SITE_TITLE%</title>
    <meta name="description" content="Private archive sales for independent labels. Each label shares a waitlist link; verified past customers get first access." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_SITE_TITLE%" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:description" content="Private archive sales for independent labels. Each label shares a waitlist link; verified past customers get first access." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/media/demo/01-jacket-full-s.jpg" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="pages" class="pages"></div>
    <div id="chrome" class="chrome-root"></div>
    <noscript>
      <div class="noscript">
        <p class="noscript__brand">%BRAND_NAME% <span>%BRAND_DESCRIPTOR%</span></p>
        <h1>Private archive sales for independent labels.</h1>
        <p>%BRAND_NAME% helps independent labels open their archives for a limited time. Each label shares a waitlist link for its sale. Bought from the label before? Verify a previous order for first access. Everyone else on the waitlist receives the second invitation.</p>
        <h2>Join the %MINO_LABEL% archive waitlist</h2>
        <form method="post" action="/api/waitlist">
          <input type="hidden" name="drop" value="%MINO_DROP_ID%" />
          <label for="ns-email">Email address</label>
          <input id="ns-email" name="email" type="email" required autocomplete="email" />
          <details>
            <summary>Bought from %MINO_LABEL% before? Get first access.</summary>
            <label for="ns-order">Order number</label>
            <input id="ns-order" name="order" aria-describedby="ns-order-help" />
            <p id="ns-order-help">Use the email address from your original order.</p>
          </details>
          <button type="submit">Join the waitlist</button>
        </form>
        <h2>Open your archive on your own site.</h2>
        <p>%BRAND_NAME% builds the archive page on your website. You share one waitlist link, your verified customers shop first, and the rest of your waitlist follows.</p>
        <p>A small upfront fee covers setup. %BRAND_NAME% then earns a percentage of sales made through the archive event.</p>
        <form method="post" action="/api/enquiry">
          <label for="ns-work">Work email</label>
          <input id="ns-work" name="email" type="email" required autocomplete="email" />
          <button type="submit">Contact %BRAND_NAME%</button>
        </form>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

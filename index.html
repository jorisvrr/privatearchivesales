    <meta name="description" content="Private archive sales for independent labels, on each label’s own website." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_SITE_TITLE%" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:description" content="Private archive sales for independent labels, on each label’s own website." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" type="image/webp" href="/media/study-001/sealed-envelope-s.webp" crossorigin="anonymous" />

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="pages" class="pages"></div>
    <div id="chrome" class="chrome-root"></div>
    <noscript>
      <div class="noscript">
        <p class="noscript__brand">%BRAND_NAME% <span>%BRAND_DESCRIPTOR%</span></p>
        <h1>Private archive sales for independent labels.</h1>
        <p>%BRAND_NAME% works with independent labels to bring past collections and samples back for a limited sale on the label’s own website. When a drop is announced, the label shares its waitlist link. Past customers can verify a previous order for first access. Everyone else who signs up is invited in the second round.</p>
        <h2>Your archive. A new source of revenue.</h2>
        <p>Turn past collections and samples into a limited sale on your own website. %BRAND_NAME% builds the experience and manages the launch. You choose the pieces, approve the prices, and fulfil the orders.</p>
        <p>Your past customers shop first. Your wider audience follows.</p>
        <p>A small upfront fee covers setup. %BRAND_NAME% then earns an agreed percentage of sales generated through the archive sale.</p>
        <form method="post" action="/api/enquiry">
          <label for="ns-work">Work email</label>
          <input id="ns-work" name="email" type="email" required autocomplete="email" />
          <button type="submit">Contact %BRAND_NAME%</button>
        </form>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>

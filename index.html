  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="pages" class="pages"></div>
    <div id="chrome" class="chrome-root"></div>
    <noscript>
      <div class="noscript">
        <p class="noscript__brand">Orvel <span>Private archive sales</span></p>
        <h1>Private archive sales for independent labels.</h1>
        <p>Orvel works with independent labels to bring past collections and samples back for a limited sale. Each archive opens on the label’s own website. The label invites its past customers first, then Orvel sends the second invitation to its mailing list.</p>
        <form method="post" action="/api/subscribe">
          <label for="ns-email">Email address</label>
          <input id="ns-email" name="email" type="email" required autocomplete="email" />
          <button type="submit">Join the mailing list</button>
        </form>
        <h2>Open your archive on your own site.</h2>
        <p>Give past collections and samples a dedicated sale on the website your customers already know. You choose the pieces and approve the prices. Orvel builds the page, coordinates the invitations, and removes the page when the drop ends.</p>
        <p>A small upfront fee covers setup. Orvel then earns a percentage of sales made through the archive event.</p>
        <form method="post" action="/api/enquiry">
          <label for="ns-work">Work email</label>
          <input id="ns-work" name="email" type="email" required autocomplete="email" />
          <button type="submit">Contact Orvel</button>
        </form>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
